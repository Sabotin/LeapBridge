log_maintenance:
  name: Log maintenance
  description: Record a completed service. It becomes the new starting point for that item's next due date and distance.
  fields:
    service_type:
      name: Service
      description: Service id from the Next maintenance sensor's items, e.g. tire_rotation or cabin_filter_replace.
      required: true
      example: tire_rotation
      selector:
        text:
    odometer_km:
      name: Odometer
      description: Odometer reading when the service was done. Defaults to the current reading.
      selector:
        number:
          min: 0
          max: 2000000
          unit_of_measurement: km
          mode: box
    date:
      name: Date
      description: Date of the service (YYYY-MM-DD). Defaults to today.
      selector:
        date:
    vin:
      name: VIN
      description: Target VIN. Required when multiple vehicles are configured.
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Optional Leapmotor entity to resolve the target vehicle.
      selector:
        text:
reset_maintenance:
  name: Reset maintenance entry
  description: Forget a logged service so the item falls back to the on-schedule assumption.
  fields:
    service_type:
      name: Service
      description: Service id to reset.
      required: true
      selector:
        text:
    vin:
      name: VIN
      description: Target VIN. Required when multiple vehicles are configured.
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Optional Leapmotor entity to resolve the target vehicle.
      selector:
        text:
preheat_cabin:
  name: Preheat cabin
  description: Heat the cabin with the vehicle's preheat preset (vehicle settings). Fields override the preset for this call. Requires the vehicle PIN.
  fields:
    temperature:
      name: Temperature
      description: 18 to 32 °C.
      example: 22
      selector:
        number:
          min: 18
          max: 32
          unit_of_measurement: "°C"
    fan_speed:
      name: Fan level
      description: 1 to 7; 7 is maximum.
      example: 7
      selector:
        number:
          min: 1
          max: 7
    recirculate:
      name: Recirculation
      description: Heat cabin air only.
      selector:
        boolean:
    vin:
      name: VIN
      description: Target VIN. Required when multiple vehicles are configured.
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Optional Leapmotor entity to resolve the target vehicle.
      selector:
        text:
precool_cabin:
  name: Pre-cool cabin
  description: Cool the cabin with A/C using the vehicle's pre-cool preset (lowest temperature and full fan by default). Fields override the preset for this call. Requires the vehicle PIN.
  fields:
    temperature:
      name: Temperature
      description: 18 to 32 °C.
      example: 22
      selector:
        number:
          min: 18
          max: 32
          unit_of_measurement: "°C"
    fan_speed:
      name: Fan level
      description: 1 to 7; 7 is maximum.
      example: 7
      selector:
        number:
          min: 1
          max: 7
    recirculate:
      name: Recirculation
      description: Cabin air only.
      selector:
        boolean:
    vin:
      name: VIN
      description: Target VIN. Required when multiple vehicles are configured.
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Optional Leapmotor entity to resolve the target vehicle.
      selector:
        text:
precondition_cabin:
  name: Pre-condition cabin (auto)
  description: Pre-cool when it is warm outside, otherwise preheat, using the vehicle presets and the outside temperature threshold. Fields override the chosen preset. Requires the vehicle PIN.
  fields:
    temperature:
      name: Temperature
      description: 18 to 32 °C.
      example: 22
      selector:
        number:
          min: 18
          max: 32
          unit_of_measurement: "°C"
    fan_speed:
      name: Fan level
      description: 1 to 7; 7 is maximum.
      example: 7
      selector:
        number:
          min: 1
          max: 7
    recirculate:
      name: Recirculation
      description: Cabin air only.
      selector:
        boolean:
    vin:
      name: VIN
      description: Target VIN. Required when multiple vehicles are configured.
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Optional Leapmotor entity to resolve the target vehicle.
      selector:
        text:

get_trips:
  name: Get trips
  description: Return the stored trip log (up to 500 trips) with times, distance, energy, consumption, speeds, eco score and zone names. Use it for exports and driver's logbooks.
  fields:
    limit:
      name: Limit
      description: How many of the newest trips to return.
      default: 500
      selector:
        number:
          min: 1
          max: 500
          mode: box
    vin:
      name: VIN
      description: Target VIN. Required when multiple vehicles are configured.
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Optional Leapmotor entity to resolve the target vehicle.
      selector:
        text:

get_charging_sessions:
  name: Get charging sessions
  description: Return the charging sessions recorded by the integration and the ones the Leapmotor cloud keeps.
  fields:
    limit:
      name: Limit
      description: How many of the newest sessions to return.
      default: 500
      selector:
        number:
          min: 1
          max: 500
          mode: box
    vin:
      name: VIN
      description: Target VIN. Required when multiple vehicles are configured.
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Optional Leapmotor entity to resolve the target vehicle.
      selector:
        text:

refresh_cloud_data:
  name: Refresh cloud data
  description: Read the software version, schedules, charging history and share invitations again now instead of waiting for their next scheduled refresh.

accept_share_invitation:
  name: Accept share invitation
  description: Accept a car that was shared with the account this integration uses. The integration reloads afterwards and adds the car.
  fields:
    vin_tail:
      name: End of the VIN
      description: Last characters of the VIN. Only needed when several invitations are waiting.
      example: "123456"
      selector:
        text:

decline_share_invitation:
  name: Decline share invitation
  description: Decline a car-share invitation waiting for the account this integration uses.
  fields:
    vin_tail:
      name: End of the VIN
      description: Last characters of the VIN. Only needed when several invitations are waiting.
      example: "123456"
      selector:
        text:
