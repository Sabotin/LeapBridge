blueprint:
  name: Leapmotor — charging complete
  description: Send a phone notification when a charging session ends, with the battery level and range.
  domain: automation
  source_url: https://github.com/Sabotin/LeapBridge/blob/main/blueprints/automation/leapmotor/charging_complete.yaml
  input:
    charging_sensor:
      name: Charging binary sensor
      selector:
        entity:
          filter:
            - integration: leapmotor
              domain: binary_sensor
    battery_sensor:
      name: Battery sensor
      selector:
        entity:
          filter:
            - integration: leapmotor
              domain: sensor
              device_class: battery
    range_sensor:
      name: Range sensor
      selector:
        entity:
          filter:
            - integration: leapmotor
              domain: sensor
              device_class: distance
    notify_device:
      name: Phone
      selector:
        device:
          filter:
            - integration: mobile_app
mode: single
trigger:
  - platform: state
    entity_id: !input charging_sensor
    from: "on"
    to: "off"
    for: "00:02:00"
variables:
  battery_sensor: !input battery_sensor
  range_sensor: !input range_sensor
action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: Charging complete
    message: >-
      Battery {{ states(battery_sensor) }} % · range {{ states(range_sensor) }} {{ state_attr(range_sensor, 'unit_of_measurement') }}
