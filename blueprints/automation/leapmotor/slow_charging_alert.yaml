blueprint:
  name: Leapmotor — slow charging alert
  description: >-
    Tell you when the car charges clearly slower than it usually does at the
    same kind of place (for example a wallbox that fell back to one phase).
    The integration compares the current AC power with your earlier sessions
    there (binary sensor "Slow charging").
  domain: automation
  source_url: https://github.com/Sabotin/LeapBridge/blob/main/blueprints/automation/leapmotor/slow_charging_alert.yaml
  input:
    slow_sensor:
      name: Slow charging
      selector:
        entity:
          filter:
            - integration: leapmotor
              domain: binary_sensor
              device_class: problem
    wait_minutes:
      name: Only when it stays slow for
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    notify_device:
      name: Phone
      selector:
        device:
          filter:
            - integration: mobile_app
mode: single
trigger:
  - platform: state
    entity_id: !input slow_sensor
    to: "on"
    for:
      minutes: !input wait_minutes
variables:
  slow_sensor: !input slow_sensor
action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: Your Leapmotor is charging slowly
    message: >-
      Charging at {{ state_attr(slow_sensor, 'now_kw') }} kW; it usually charges at about
      {{ state_attr(slow_sensor, 'usual_kw') }} kW here.
