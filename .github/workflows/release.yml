name: Release

on:
  release:
    types:
      - published
  # Run by hand from the Actions tab to create the release itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.7.5 (must match the manifest version)"
        required: true
        type: string
      notes:
        description: "Release notes (Markdown)"
        required: false
        type: string
        default: "See CHANGELOG.md."

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify release tag matches manifest version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/check_release_version.py "$RELEASE_TAG"

      - name: Build HACS release ZIP
        run: bash scripts/build_release_zip.sh /tmp/leapmotor-ha.zip

      - name: Create the release with the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release create "$RELEASE_TAG" /tmp/leapmotor-ha.zip \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "LeapBridge ${RELEASE_TAG#v}" \
            --notes-file /tmp/release-notes.md

  upload-hacs-zip:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          python3 scripts/check_release_version.py "$RELEASE_TAG"

      - name: Build HACS release ZIP
        run: bash scripts/build_release_zip.sh /tmp/leapmotor-ha.zip

      - name: Validate HACS release ZIP
        run: |
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile("/tmp/leapmotor-ha.zip") as archive:
              names = set(archive.namelist())
          required = {"manifest.json", "__init__.py", "api.py"}
          forbidden = {
              "custom_components/leapmotor/manifest.json",
              "app_cert.pem",
              "app_key.pem",
          }
          missing = required - names
          present_forbidden = forbidden & names
          cache_entries = {
              name
              for name in names
              if "__pycache__" in name or name.endswith(".pyc")
          }
          nested_archives = {
              name for name in names if name.lower().endswith(".zip")
          }
          if missing:
              raise SystemExit(f"release ZIP missing root files: {sorted(missing)}")
          if present_forbidden:
              raise SystemExit(
                  f"release ZIP contains forbidden entries: {sorted(present_forbidden)}"
              )
          if cache_entries:
              raise SystemExit(
                  f"release ZIP contains Python cache entries: {sorted(cache_entries)}"
              )
          if nested_archives:
              raise SystemExit(
                  f"release ZIP contains nested ZIP files: {sorted(nested_archives)}"
              )
          print("ok release ZIP layout")
          PY

      - name: Upload HACS release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          /tmp/leapmotor-ha.zip
          --clobber
          --repo "${{ github.repository }}"
