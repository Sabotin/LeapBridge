<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leapmotor Card Preview</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #060a16; }
    body { padding: 28px; min-height: 100vh; box-sizing: border-box; font-family: system-ui, sans-serif; color: #c3cbe0; }
    .wrap { max-width: 1440px; margin: 0 auto; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 auto 16px; max-width: 1440px; font-size: 13px; }
    .bar a { color: #ffc461; text-decoration: none; padding: 5px 10px; border: 1px solid rgba(246,168,35,.35); border-radius: 999px; }
    .bar a:hover { background: rgba(246,168,35,.12); }
    .bar span { color: #5f6a82; margin-left: 6px; }
    body.shot .bar { display: none; }
    body.shot { padding: 0; min-height: 0; }
    html:has(body.shot), body.shot { background: transparent; }
    @media (max-width: 600px) { body { padding: 10px; } }
  </style>
</head>
<body>
  <nav class="bar">
    <span>Scenario</span>
    <a href="?state=charging">Charging · night</a>
    <a href="?state=parked&scene=day">Parked · day</a>
    <a href="?state=attention">Needs attention</a>
    <a href="?state=driving">Driving · too fast</a>
    <span>Language</span>
    <a href="?lang=en">EN</a><a href="?lang=sl">SL</a><a href="?lang=de">DE</a>
  </nav>
  <div class="wrap"><leapmotor-card id="card"></leapmotor-card></div>

  <script type="module">
    import "../../custom_components/leapmotor/frontend/leapmotor-card.js";

    /* Demo data only: a synthetic C10 with a believable day of driving and charging. */
    const q = new URLSearchParams(location.search);
    const scenario = q.get("state") || "charging";
    const lang = q.get("lang") || "en";
    const scene = q.get("scene") || (scenario === "parked" ? "day" : "night");
    const sections = q.get("sections") ? q.get("sections").split(",") : undefined;
    if (q.get("shot")) document.body.classList.add("shot");

    const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
    const now = q.get("now") ? new Date(q.get("now")).getTime() : Date.now();
    const iso = (t) => new Date(t).toISOString();
    const charging = scenario === "charging";
    const attention = scenario === "attention";
    const driving = scenario === "driving";

    /* ---------- 24 h timeline (hours ago) ---------- */
    const events = [
      { from: 24, to: 15.5, kind: "park", soc: [66, 64] },
      { from: 15.5, to: 14.6, kind: "drive", soc: [64, 55], km: 32 },
      { from: 14.6, to: 6.2, kind: "park", soc: [55, 54] },
      { from: 6.2, to: 5.3, kind: "drive", soc: [54, 44], km: 36 },
      ...(charging
        ? [{ from: 5.3, to: 1.8, kind: "park", soc: [44, 44] }, { from: 1.8, to: 0, kind: "charge", soc: [44, 71.4] }]
        : [{ from: 5.3, to: 3.6, kind: "park", soc: [44, 44] }, { from: 3.6, to: 1.6, kind: "charge", soc: [44, 74] }, { from: 1.6, to: 0, kind: "park", soc: [74, 73.6] }]),
    ];
    const series = { battery: [], range: [], power: [], odometer: [], charging: [], driving: [] };
    let odo = 18384;
    for (let ago = 24; ago >= 0; ago -= 5 / 60) {
      const t = now - ago * HOUR;
      const ev = events.find((e) => ago <= e.from && ago >= e.to) || events[events.length - 1];
      const k = (ev.from - ago) / (ev.from - ev.to || 1);
      const soc = ev.soc[0] + (ev.soc[1] - ev.soc[0]) * k;
      if (ev.kind === "drive") odo += (ev.km / ((ev.from - ev.to) * 12));
      series.battery.push([t, Math.round(soc)]);
      series.range.push([t, Math.round(soc * 4.45)]);
      series.power.push([t, ev.kind === "charge" ? +(10.6 + Math.sin(t / 6e5) * 0.3).toFixed(1) : 0]);
      series.odometer.push([t, Math.round(odo)]);
      series.charging.push([t, ev.kind === "charge"]);
      series.driving.push([t, ev.kind === "drive"]);
    }
    const soc = charging ? 71.4 : 73.6;

    /* ---------- last 7 days (cloud daily_detail) ---------- */
    const km = [42, 0, 61, 87, 23, 38, 68];
    const kwh = [6.4, 0, 9.3, 13.6, 3.9, 5.8, 10.2];
    const daily = km.map((m, i) => {
      const d = new Date(now - (6 - i) * DAY);
      const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      return { date, mileage_km: m, driving_energy_kwh: kwh[i], energy_kwh: kwh[i] };
    });

    /* ---------- states ---------- */
    const S = {};
    const E = {};
    const add = (entity_id, translation_key, state, attributes = {}) => {
      S[entity_id] = { entity_id, state: String(state), attributes, last_updated: iso(now - 3 * MIN), last_changed: iso(now - 3 * MIN) };
      E[entity_id] = { entity_id, platform: "leapmotor", device_id: "demo-c10", translation_key };
    };
    const meta = { vin: "DEMO-VIN", car_type: "C10", is_shared: false };
    const u = (unit, extra = {}) => ({ ...meta, unit_of_measurement: unit, ...extra });

    add("sensor.c10_battery", "battery_percent", Math.round(soc), u("%", { device_class: "battery" }));
    add("sensor.c10_precise_battery", "battery_percent_precise", soc, u("%"));
    add("sensor.c10_range", "remaining_range_km", Math.round(soc * 4.45), u("km"));
    add("sensor.c10_odometer", "odometer_km", Math.round(odo), u("km"));
    add("sensor.c10_speed", "speed_kmh", driving ? 128 : 0, u("km/h"));
    add("sensor.c10_gear", "gear", "P", meta);
    add("sensor.c10_interior_temperature", "interior_temp_c", scene === "day" ? 17.5 : 11.5, u("°C"));
    add("sensor.c10_outdoor_temperature", "outdoor_temp_c", scene === "day" ? 9.4 : 2.8, u("°C"));
    add("sensor.c10_charge_limit", "charge_limit_percent", 90, u("%"));
    add("sensor.c10_remaining_charge_time", "remaining_charge_minutes", charging ? 74 : "unavailable", u("min"));
    add("sensor.c10_charging_finish_time", "charging_finish_time", charging ? iso(now + 74 * MIN) : "unavailable", meta);
    add("sensor.c10_charging_power", "charging_power_kw", charging ? 10.8 : 0, u("kW"));
    add("sensor.c10_charging_current", "charging_current_a", charging ? -15.6 : 0, u("A"));
    add("sensor.c10_charging_voltage", "charging_voltage_v", charging ? 401 : 0, u("V"));
    add("sensor.c10_charging_connection", "charging_connection_state", charging ? "charging" : "unplugged", meta);
    add("sensor.c10_vehicle_state", "vehicle_state", driving ? "driving" : "parked", meta);
    add("sensor.c10_last_vehicle_update", "last_vehicle_update", iso(now - 3 * MIN), meta);
    add("sensor.c10_last_7_days_mileage", "last_7_days_mileage_km", km.reduce((a, b) => a + b, 0), u("km", { daily_detail: daily }));
    add("sensor.c10_six_week_average_consumption", "average_consumption_6w_kwh_100km", 15.8, u("kWh/100 km"));
    add("sensor.c10_last_week_driving_energy", "last_week_driving_energy_percent", 78.4, u("%"));
    add("sensor.c10_last_week_climate_energy", "last_week_climate_energy_percent", 14.1, u("%"));
    add("sensor.c10_last_week_other_energy", "last_week_other_energy_percent", 7.5, u("%"));
    add("sensor.c10_last_charge_energy", "last_charge_energy_kwh", 31.6, u("kWh", { charge_type: "AC" }));
    add("sensor.c10_front_left_tire_pressure", "tire_pressure_front_left_bar", 2.5, u("bar"));
    add("sensor.c10_front_right_tire_pressure", "tire_pressure_front_right_bar", 2.5, u("bar"));
    add("sensor.c10_rear_left_tire_pressure", "tire_pressure_rear_left_bar", attention ? 1.8 : 2.4, u("bar"));
    add("sensor.c10_rear_right_tire_pressure", "tire_pressure_rear_right_bar", 2.4, u("bar"));
    add("binary_sensor.c10_charging", "is_charging", charging ? "on" : "off", meta);
    add("binary_sensor.c10_charge_cable_plugged_in", "is_plugged_in", charging ? "on" : "off", meta);
    add("binary_sensor.c10_is_driving", "is_driving", driving ? "on" : "off", meta);
    add("binary_sensor.c10_driver_door", "driver_door_open", attention ? "on" : "off", meta);
    add("binary_sensor.c10_passenger_door", "passenger_door_open", "off", meta);
    add("binary_sensor.c10_rear_left_door", "rear_left_door_open", "off", meta);
    add("binary_sensor.c10_rear_right_door", "rear_right_door_open", "off", meta);
    add("binary_sensor.c10_trunk", "trunk_open", attention ? "on" : "off", meta);
    for (const w of ["front_left", "front_right", "rear_left", "rear_right"]) add(`binary_sensor.c10_${w}_window`, `${w}_window_open`, "off", meta);
    add("binary_sensor.c10_skylight_open", "skylight_open", "off", meta);
    add("binary_sensor.c10_climate", "climate_on", driving || attention ? "on" : "off", meta);
    add("sensor.c10_climate_mode", "climate_mode", driving || attention ? "fast_heat" : "off", meta);
    add("sensor.c10_speed_limit", "speed_limit_kmh", 120, u("km/h"));
    add("binary_sensor.c10_speed_limit_active", "speed_limit_enabled", "on", meta);
    add("binary_sensor.c10_speeding", "speeding", driving ? "on" : "off",
      { ...meta, device_class: "problem", speed_kmh: driving ? 128 : 0, threshold_kmh: 120, threshold_source: "vehicle" });
    add("number.c10_charge_limit_setting", "charge_limit_setting", 90, { ...meta, min: 50, max: 100, step: 5, unit_of_measurement: "%" });
    add("lock.c10_lock", "vehicle_lock", attention ? "unlocked" : "locked", meta);
    add("device_tracker.c10_location", "location", scenario === "parked" ? "not_home" : "home", { ...meta, latitude: 46.05, longitude: 14.5 });
    add("switch.c10_climate", "climate_control", "off", meta);
    add("switch.c10_battery_preheat", "battery_preheat", "off", meta);
    add("switch.c10_steering_wheel_heating", "steering_wheel_heat", "off", meta);
    add("switch.c10_mirror_heating", "rearview_mirror_heat", "off", meta);
    add("switch.c10_charging_schedule", "charging_schedule", "on", meta);
    for (const [slug, tk] of [["refresh_data", "refresh_data"], ["unlock_charger", "unlock_charger"], ["open_trunk", "open_trunk"],
      ["close_trunk", "close_trunk"], ["find_vehicle", "find_vehicle"], ["open_windows", "open_windows"], ["close_windows", "close_windows"],
      ["quick_cool", "quick_cool"], ["quick_heat", "quick_heat"], ["windshield_defrost", "windshield_defrost"],
      ["open_sunshade", "open_sunshade"], ["close_sunshade", "close_sunshade"]]) add(`button.c10_${slug}`, tk, "unknown", meta);
    /* trip log, charging sessions, battery health (analytics sensors) */
    const trip = (agoStart, agoEnd, km, kwh, soc0, soc1, vmax) => ({
      start: iso(now - agoStart * HOUR), end: iso(now - agoEnd * HOUR), distance_km: km,
      duration_min: Math.round((agoStart - agoEnd) * 60), energy_kwh: kwh,
      consumption_kwh_100km: +(kwh / km * 100).toFixed(1), avg_speed_kmh: Math.round(km / (agoStart - agoEnd)),
      max_speed_kmh: vmax, start_soc: soc0, end_soc: soc1, outdoor_temp_c: 6,
    });
    const recent = [
      trip(6.2, 5.3, 36.4, 6.9, 54, 44, 118),
      trip(15.5, 14.6, 31.8, 6.2, 64, 55, 104),
      trip(27.1, 26.8, 6.3, 1.2, 70, 68, 62),
      trip(31.4, 30.9, 18.9, 3.3, 77, 72, 91),
      trip(39.6, 38.7, 32.2, 5.4, 89, 81, 112),
      trip(48.9, 48.6, 4.1, 0.9, 92, 91, 54),
    ];
    const live = driving ? { start: iso(now - 26 * MIN), end: iso(now - MIN), distance_km: 31.4, duration_min: 25 } : null;
    const tAttrs = { ...meta, unit_of_measurement: "km", ...recent[0], recent_trips: recent, current_trip: live };
    delete tAttrs.distance_km;
    add("sensor.c10_last_trip_distance", "last_trip_distance_km", recent[0].distance_km, tAttrs);
    add("sensor.c10_last_trip_consumption", "last_trip_consumption_kwh_100km", recent[0].consumption_kwh_100km, u("kWh/100 km"));
    add("sensor.c10_distance_today", "trips_today_distance_km", 68.2, u("km", { trips: 2, energy_kwh: 13.1, duration_min: 108 }));
    add("sensor.c10_distance_this_month", "trips_month_distance_km", 412, u("km", { trips: 23, energy_kwh: 63.4, duration_min: 731 }));
    add("sensor.c10_last_charging_session_energy", "last_charge_session_energy_kwh", 31.6,
      u("kWh", { start: iso(now - 30 * HOUR), end: iso(now - 27 * HOUR), duration_min: 182, tier: "home", peak_power_kw: 11, cost: 6.32, price_kwh: 0.2, start_soc: 41, end_soc: 89, dc: false }));
    add("sensor.c10_last_charging_session_cost", "last_charge_session_cost", 6.32, u("EUR", { device_class: "monetary" }));
    add("sensor.c10_charging_cost_this_month", "charging_cost_month", 18.4, u("EUR", { device_class: "monetary", sessions: 4, energy_kwh: 92.1, home_energy_kwh: 74.6, public_energy_kwh: 17.5 }));
    add("sensor.c10_charged_energy_this_month", "charged_energy_month_kwh", 92.1, u("kWh"));
    add("sensor.c10_battery_health", "battery_health_percent", 97.8, u("%", { capacity_kwh: 67.4, reference_kwh: 68.9, reference_source: "observed", samples: 21 }));
    /* stage 2/3 and extras */
    const mItem = (service_type, label, status, remaining_km, remaining_days, interval_km, interval_months, baseline = "assumed") =>
      ({ service_type, label, status, remaining_km, remaining_days, interval_km, interval_months, baseline, priority: "routine", category: "x" });
    const mItems = [
      mItem("tire_rotation", "Tire rotation", "due_soon", 620, null, 10000, null),
      mItem("cabin_filter_replace", "Cabin (A/C) filter — replacement", "due_soon", 1550, 41, 20000, 12, "logged"),
      mItem("brake_fluid_inspect", "Brake fluid — inspection", "ok", 1550, 211, 20000, 12),
      mItem("wiper_blades_replace", "Wiper blades — replacement", "ok", null, 248, null, 12),
      mItem("brake_fluid_replace", "Brake fluid — replacement (DOT4)", "ok", 21550, 576, 40000, 24),
      mItem("tire_replace", "Tires — replacement", "ok", 41550, 941, 60000, 36),
    ];
    add("sensor.c10_next_maintenance", "next_maintenance", mItems[0].label, { ...meta, ...mItems[0], overdue: 0, due_soon: 2, schedule: "C10", items: mItems });
    add("binary_sensor.c10_maintenance_due", "maintenance_due", "on", { ...meta, device_class: "problem", overdue: 0, due_soon: 2 });
    add("binary_sensor.c10_attention_needed", "attention_needed", attention ? "on" : "off", { ...meta, device_class: "problem", reasons: attention ? ["unlocked", "door_open", "tire_pressure"] : [] });
    add("binary_sensor.c10_tire_pressure_warning", "tire_pressure_warning", attention ? "on" : "off", { ...meta, device_class: "problem", reasons: attention ? ["rear_left_low"] : [] });
    add("sensor.c10_driving_cost_this_month", "driving_cost_month", 12.68, u("EUR", { device_class: "monetary", today: 2.6, last_trip: 1.38, avg_price_kwh: 0.2 }));
    add("sensor.c10_driving_cost_per_100_km", "driving_cost_per_100km", 3.08, u("EUR/100 km"));
    add("sensor.c10_parked_battery_drain", "parked_drain_kwh_day", 0.62, u("kWh/d", { pct_per_day: 0.9, hours_observed: 21.5 }));
    add("sensor.c10_energy_to_charge_limit", "energy_to_charge_limit_kwh", charging ? 13.0 : 11.5,
      u("kWh", { limit: 90, soc: soc, capacity_kwh: 69.9, low_tariff_now: false, cost_now: 3.25, cost_low_tariff: 1.56, saving: 1.69, next_low_tariff: iso(now + 4 * HOUR) }));
    add("switch.c10_sentry_mode", "sentry_mode", "off", meta);
    add("switch.c10_healthy_charging", "healthy_charging", "on", meta);
    add("button.c10_start_charging", "start_charging", "unknown", meta);
    add("button.c10_stop_charging", "stop_charging", "unknown", meta);
    add("button.c10_preheat_cabin", "preheat_cabin", "unknown", { ...meta, mode: "hot", temperature: 22, fan_speed: 7, recirculate: true });
    add("button.c10_precool_cabin", "precool_cabin", "unknown", { ...meta, mode: "cold", temperature: 18, fan_speed: 7, recirculate: true });
    add("button.c10_precondition_cabin", "precondition_cabin", "unknown", { ...meta, mode: scene === "day" ? "cold" : "hot", temperature: scene === "day" ? 18 : 22, fan_speed: 7, recirculate: true });
    S["sensor.c10_last_trip_consumption"].attributes = { ...S["sensor.c10_last_trip_consumption"].attributes,
      similar_trips: 6, usual_consumption_kwh_100km: 20.4, vs_usual_pct: -6.9,
      efficiency_by_temperature: [{ band: "below_0", trips: 4, consumption_kwh_100km: 21.6 }, { band: "0_10", trips: 19, consumption_kwh_100km: 18.4 },
                                  { band: "10_20", trips: 31, consumption_kwh_100km: 15.1 }, { band: "above_20", trips: 12, consumption_kwh_100km: 14.2 }] };
    if (q.get("pic")) add("image.c10_vehicle_picture", "vehicle_picture", iso(now - DAY), { ...meta, entity_picture: q.get("pic") });
    S["sun.sun"] = { entity_id: "sun.sun", state: scene === "day" ? "above_horizon" : "below_horizon", attributes: {}, last_updated: iso(now) };
    S["zone.home"] = { entity_id: "zone.home", state: "0", attributes: { friendly_name: "Home" }, last_updated: iso(now) };

    const histIds = {
      "sensor.c10_battery": series.battery, "sensor.c10_range": series.range, "sensor.c10_charging_power": series.power,
      "sensor.c10_odometer": series.odometer, "binary_sensor.c10_charging": series.charging, "binary_sensor.c10_is_driving": series.driving,
    };

    /* ---------- GPS route and speed for the trip map (synthetic, around Ljubljana) ---------- */
    const route = { "device_tracker.c10_location": [], "sensor.c10_speed": [] };
    const drive = (t0, t1, from, to, bend, seed) => {
      const n = 34;
      for (let i = 0; i <= n; i++) {
        const k = i / n, t = t0 + (t1 - t0) * k;
        const lat = from[0] + (to[0] - from[0]) * k + Math.sin(k * Math.PI) * bend + Math.sin(k * 9 + seed) * 0.0035;
        const lon = from[1] + (to[1] - from[1]) * k + Math.sin(k * 6 + seed) * 0.006;
        const v = k < 0.18 || k > 0.86 ? 38 + 14 * Math.sin(k * 30) : 104 + 20 * Math.sin(k * 7 + seed);
        route["device_tracker.c10_location"].push({ s: "not_home", a: { latitude: +lat.toFixed(6), longitude: +lon.toFixed(6) }, lu: t / 1000 });
        route["sensor.c10_speed"].push({ s: String(Math.max(0, Math.round(v))), lu: t / 1000 });
      }
    };
    drive(now - 6.2 * HOUR, now - 5.3 * HOUR, [46.0569, 14.5058], [46.2397, 14.3556], 0.012, 1);
    drive(now - 15.5 * HOUR, now - 14.6 * HOUR, [46.2397, 14.3556], [46.0569, 14.5058], -0.01, 4);
    if (driving) drive(now - 26 * MIN, now - MIN, [46.0569, 14.5058], [45.9606, 14.6589], 0.008, 2.5);

    const hass = {
      states: S,
      entities: E,
      devices: { "demo-c10": { name: "Leapmotor C10 (Main)" } },
      language: lang,
      locale: { language: lang },
      callWS: async (msg) => {
        if (msg.type !== "history/history_during_period") return {};
        const out = {};
        const from = Date.parse(msg.start_time) / 1000, to = Date.parse(msg.end_time) / 1000;
        for (const id of msg.entity_ids) {
          if (route[id]) {
            out[id] = route[id].filter((st) => st.lu >= from && st.lu <= to);
            continue;
          }
          const s = histIds[id];
          if (!s) continue;
          let last;
          out[id] = s.filter(([, v]) => { const keep = v !== last; last = v; return keep; })
            .map(([t, v]) => ({ s: typeof v === "boolean" ? (v ? "on" : "off") : String(v), lu: t / 1000 }));
        }
        return out;
      },
      callService: async (domain, service, data) => {
        console.log("callService", domain, service, data);
      },
    };

    const card = document.getElementById("card");
    card.setConfig({ type: "custom:leapmotor-card", scene, language: lang, ...(sections ? { sections } : {}) });
    card.hass = hass;
    window.__card = card;
  </script>
</body>
</html>
