<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leapmotor Banner</title>
  <!--
    Source of the picture at the top of the README files. Open with ?lang=sl or
    ?lang=de for the other languages and take a 1280 x 640 screenshot of
    #banner. The four screenshots in banner/ show the dashboard on a real car.
  -->
  <style>
    @font-face { font-family: "LM Outfit"; font-weight: 100 900; src: url("../../custom_components/leapmotor/frontend/fonts/outfit-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "LM Outfit"; font-weight: 100 900; src: url("../../custom_components/leapmotor/frontend/fonts/outfit-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; }
    body { font-family: "LM Outfit", sans-serif; color: #f1f4fa; -webkit-font-smoothing: antialiased; }
    .banner { position: relative; width: 1280px; height: 640px; border-radius: 28px; overflow: hidden;
      background: radial-gradient(900px 520px at 78% 40%, #232c4b 0%, rgba(35,44,75,0) 70%), radial-gradient(700px 400px at 10% 0%, #1a2240 0%, rgba(26,34,64,0) 70%), linear-gradient(160deg, #131a30 0%, #0b1020 60%, #090d1a 100%); }
    .glow { position: absolute; left: 470px; right: 20px; bottom: -60px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, rgba(246,168,35,.13), rgba(246,168,35,0)); }
    .copy { position: absolute; left: 60px; top: 0; bottom: 0; width: 372px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .3em; color: #c3cbe0; text-transform: uppercase; }
    .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: #f6a823; box-shadow: 0 0 12px #f6a823; }
    .icon { width: 76px; height: 76px; border-radius: 19px; margin-top: 30px; box-shadow: 0 14px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08); }
    h1 { font-size: 72px; line-height: 1; font-weight: 700; letter-spacing: -.02em; margin-top: 20px; }
    h2 { font-size: 29px; line-height: 1.1; font-weight: 500; color: #fbbf4d; margin-top: 8px; }
    p { font-size: 18.5px; line-height: 1.5; color: #b9c2d8; margin-top: 22px; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
    .chip { display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgba(9,13,26,.6); border: 1px solid rgba(255,255,255,.12); white-space: nowrap; }
    .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
    .shot { position: absolute; width: 258px; border-radius: 17px; overflow: hidden; background: #0d1326; box-shadow: 0 26px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.11); }
    .shot img { display: block; width: 100%; }
    .shot.fade::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(180deg, rgba(13,19,38,0), #0d1326 85%); }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="glow"></div>
    <div class="copy">
      <div class="eyebrow"><i></i><span data-sl="Integracija za Home Assistant" data-de="Home-Assistant-Integration">Home Assistant integration</span></div>
      <img class="icon" src="../../brand/icon.png" alt="">
      <h1>Leapmotor</h1>
      <h2 data-sl="za Home Assistant" data-de="für Home Assistant">for Home Assistant</h2>
      <p data-sl="Baterija, polnjenje, vrata, pnevmatike, vožnje in daljinsko upravljanje, z vgrajeno nadzorno ploščo v treh temah." data-de="Akku, Laden, Türen, Reifen, Fahrten und Fernsteuerung, mit eingebautem Dashboard in drei Designs.">Battery, charging, doors, tires, trips and remote control, with a built-in dashboard in three themes.</p>
      <div class="chips">
        <span class="chip" style="--c:#f6a823"><i></i><span data-sl="Namestitev prek HACS" data-de="HACS-fähig">HACS ready</span></span>
        <span class="chip" style="--c:#34d399"><i></i>C10 · B10 · T03 · A10</span>
        <span class="chip" style="--c:#38bdf8"><i></i><span data-sl="Slovenščina" data-de="Deutsch">Dashboard card included</span></span>
      </div>
    </div>
    <div class="shot" style="left:462px;top:34px"><img src="banner/shot-1.webp" alt=""></div>
    <div class="shot" style="left:462px;top:434px"><img src="banner/shot-3.webp" alt=""></div>
    <div class="shot" style="left:734px;top:120px"><img src="banner/shot-2.webp" alt=""></div>
    <div class="shot fade" style="left:1006px;top:62px"><img src="banner/shot-4.webp" alt=""></div>
  </div>
  <script>
    const lang = new URLSearchParams(location.search).get("lang");
    if (lang === "sl" || lang === "de") {
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll(`[data-${lang}]`)) el.textContent = el.dataset[lang];
    }
  </script>
</body>
</html>
