<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leapmotor Banner</title>
  <style>
    @font-face { font-family: "LM Outfit"; font-weight: 100 900; src: url("../../custom_components/leapmotor/frontend/fonts/outfit-latin-wght-normal.woff2") format("woff2"); }
    @font-face { font-family: "LM JetBrains Mono"; font-weight: 100 900; src: url("../../custom_components/leapmotor/frontend/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }
    :root { color-scheme: dark; }
    html, body { margin: 0; background: transparent; }
    /* Car app theme of the card: navy studio, spotlight on the car, floor reflection. */
    .banner { position: relative; width: 1280px; height: 560px; overflow: hidden; border-radius: 28px; font-family: "LM Outfit", system-ui, sans-serif; color: #e9eef8;
      background: radial-gradient(34% 58% at 75% 66%, rgba(165,190,255,.2), transparent 72%), linear-gradient(180deg, #131c35, #0a1124); }
    .floor { position: absolute; right: 20px; bottom: 22px; width: 680px; height: 150px; border-radius: 50%; background: radial-gradient(closest-side, rgba(185,205,255,.17), transparent); }
    .copy { position: absolute; left: 64px; top: 60px; width: 600px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: #c3cbe0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f6a823; box-shadow: 0 0 12px #f6a823; }
    .brand { display: flex; align-items: center; gap: 20px; margin-top: 26px; }
    .brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 18px 40px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08); }
    h1 { margin: 0; font-size: 80px; line-height: .95; font-weight: 700; letter-spacing: -.035em; }
    h1 span { display: block; font-size: 30px; font-weight: 500; letter-spacing: -.01em; color: #ffc461; margin-top: 10px; }
    p { margin: 26px 0 0; font-size: 19px; line-height: 1.5; color: #c3cbe0; max-width: 520px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(9,15,33,.62); border: 1px solid rgba(148,163,184,.2); font-size: 14px; font-weight: 600; backdrop-filter: blur(8px); }
    .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
    .car { position: absolute; right: 70px; bottom: 58px; width: 520px; }
    .car svg.carsvg { width: 100%; height: auto; display: block; -webkit-box-reflect: below -2px linear-gradient(transparent 80%, rgba(255,255,255,.13)); }
    .tp { position: absolute; top: calc(100% + 12px); transform: translateX(-50%); padding: 3px 11px; border-radius: 999px; background: rgba(9,15,33,.8); border: 1px solid rgba(148,163,184,.22); font: 600 14px "LM JetBrains Mono", monospace; white-space: nowrap; }
    .tp small { font: 500 12px "LM Outfit", sans-serif; color: #98a3b8; margin-left: 4px; }
    .wallbox { position: absolute; left: -36px; bottom: 12px; width: 22px; height: 74px; border-radius: 7px; background: linear-gradient(180deg,#26324f,#141c33); border: 1px solid rgba(148,163,184,.25); }
    .wallbox::after { content: ""; position: absolute; left: 50%; top: 13px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #34d399; box-shadow: 0 0 12px #34d399; }
    .cable { position: absolute; left: -26px; bottom: 6%; width: calc(16% + 26px); height: 52%; overflow: visible; }
    .cable path { fill: none; stroke: #34d399; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 5 7; filter: drop-shadow(0 0 4px #34d399); }
    .glow { position: absolute; left: 8%; right: 8%; bottom: -8px; height: 40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(52,211,153,.5), transparent); filter: blur(6px); }
    .stat { position: absolute; right: 86px; top: 58px; padding: 18px 22px; border-radius: 18px; background: rgba(9,15,33,.55); border: 1px solid rgba(148,163,184,.18); backdrop-filter: blur(12px); min-width: 300px; }
    .stat small { display: block; font-size: 14px; color: #a9b3c7; font-weight: 600; }
    .stat b { display: flex; align-items: baseline; gap: 6px; font-size: 58px; line-height: 1; margin-top: 4px; letter-spacing: -.035em; }
    .stat b em { font-style: normal; font-size: 22px; color: #f6a823; font-weight: 600; letter-spacing: 0; }
    .batt { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .bwrap { position: relative; flex: 1; padding-right: 7px; }
    .bwrap::after { content: ""; position: absolute; right: 0; top: 50%; width: 5px; height: 10px; margin-top: -5px; border-radius: 0 3px 3px 0; background: rgba(148,163,184,.4); }
    .bseg { position: relative; height: 20px; border-radius: 5px; background: rgba(148,163,184,.17); overflow: hidden;
      -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 3px), transparent calc(10% - 3px) 10%); mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 3px), transparent calc(10% - 3px) 10%); }
    .bseg i { position: absolute; left: 0; top: 0; bottom: 0; width: 71.4%; background: linear-gradient(90deg, #10b981, #6ee7b7); }
    .blim { position: absolute; top: -5px; bottom: -5px; left: calc((100% - 7px) * .9); width: 3px; margin-left: -1.5px; border-radius: 2px; background: #f8fafc; box-shadow: 0 0 0 2px rgba(10,17,36,.85); }
    .batt span { font-size: 19px; font-weight: 700; }
    .stat .row { display: flex; gap: 14px; margin-top: 12px; font-size: 14px; font-weight: 600; color: #c3cbe0; }
    .stat .row span { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="floor"></div>
    <div class="copy">
      <div class="eyebrow"><span class="dot"></span><span data-sl="Integracija za Home Assistant">Home Assistant integration</span></div>
      <div class="brand">
        <img src="../../custom_components/leapmotor/logo.svg" alt="">
        <h1>Leapmotor<span data-sl="za Home Assistant">for Home Assistant</span></h1>
      </div>
      <p data-sl="Baterija, polnjenje, vrata, pnevmatike, vožnje in daljinsko upravljanje — z vgrajeno nadzorno ploščo v treh temah.">Battery, charging, doors, tires, trips and remote control — with a built-in dashboard in three themes.</p>
      <div class="chips">
        <span class="chip"><i style="--c:#f6a823"></i><span data-sl="Namestitev prek HACS">HACS ready</span></span>
        <span class="chip"><i style="--c:#34d399"></i>C10 · B10 · T03 · A10</span>
        <span class="chip"><i style="--c:#38bdf8"></i><span data-sl="Slovenščina">Dashboard card included</span></span>
      </div>
    </div>
    <div class="stat">
      <small data-sl="Doseg">Range</small>
      <b>318<em>km</em></b>
      <div class="batt"><div class="bwrap"><div class="bseg"><i></i></div><span class="blim"></span></div><span data-sl="71,4 %">71.4 %</span></div>
      <div class="row"><span style="color:#34d399" data-sl="● Polnjenje · 10,8 kW">● Charging · 10.8 kW</span><span>1 h 14 min</span></div>
    </div>
    <div class="car" id="car"><div class="glow"></div><div class="wallbox"></div>
      <svg class="cable" viewBox="0 0 100 96" preserveAspectRatio="none"><path d="M8 50C14 98 70 102 96 30" vector-effect="non-scaling-stroke"/></svg>
      <span class="tp" style="left:24.3%"><span data-sl="2,4 · 2,4">2.4 · 2.4</span><small>bar</small></span><span class="tp" style="left:76.5%"><span data-sl="2,5 · 2,5">2.5 · 2.5</span><small>bar</small></span>
    </div>
  </div>
  <script type="module">
    import "../../custom_components/leapmotor/frontend/leapmotor-card.js";
    const art = customElements.get("leapmotor-card").art;
    document.getElementById("car").insertAdjacentHTML("beforeend", art.carSvg(true));
    if (new URLSearchParams(location.search).get("lang") === "sl") {
      document.documentElement.lang = "sl";
      for (const el of document.querySelectorAll("[data-sl]")) el.textContent = el.dataset.sl;
    }
  </script>
</body>
</html>
